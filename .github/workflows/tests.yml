name: Python CI - Pruebas Automatizadas

# Controla cuándo se ejecutará este flujo (cada vez que hagas push a main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas:
    # Levanta una máquina virtual con la versión más reciente de Ubuntu Linux
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código del repositorio en la máquina virtual
    - name: Descargar código fuente
      uses: actions/checkout@v4

    # 2. Configura el entorno de Python 3.12 en la nube
    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 3. Instala tus 13 librerías desde el archivo requirements.txt que creamos
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Ejecuta Pytest con cobertura idéntico a como lo haces en tu Mac
    - name: Ejecutar pruebas con Pytest y Cobertura
      run: |
        pytest --cov=. --cov-report=term-missing
